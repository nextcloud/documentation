version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 10
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "06:00"
    target-branch: master
    open-pull-requests-limit: 10
    cooldown:
      default-days: 10
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      time: "06:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 10
    ignore:
      # Stick to Ubuntu LTS releases (even year, .04)
      - dependency-name: "ubuntu"
        versions: ["25.x", "26.10", "27.x", "28.10", "29.x"]
